services:
  mysql:
    image: mysql:8.0
    container_name: hycora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: hycora
      MYSQL_USER: hycora
      MYSQL_PASSWORD: hycora1234
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hycora-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hycora
      SPRING_DATASOURCE_USERNAME: hycora
      SPRING_DATASOURCE_PASSWORD: hycora1234
      CORS_ORIGIN: ${CORS_ORIGIN:-https://hycora.co.kr}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAGIC_LINK_CALLBACK_URL: ${MAGIC_LINK_CALLBACK_URL:-https://hycora.co.kr/html/admin/auth-callback.html}
      UPLOAD_DIR: /var/www/hycora-uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${HOST_UPLOAD_DIR:-/var/www/hycora-uploads}:/var/www/hycora-uploads

volumes:
  mysql-data:
